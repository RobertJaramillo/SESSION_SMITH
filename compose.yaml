services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campaign_orchestration}
      POSTGRES_USER: ${POSTGRES_USER:-campaign_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campaign_app}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-campaign_orchestration}
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1,172.16.0.0/12}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      # Google OAuth is exchanged for a Firebase identity in Firebase mode.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
    volumes:
      - type: bind
        source: ${FIREBASE_ADMIN_CREDENTIALS_PATH:-/dev/null}
        target: /run/secrets/firebase-admin.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations and seed the demo campaign, then serve.
    command: >
      sh -c "python -m backend.migrate &&
             python -m backend.seed_demo &&
             uvicorn backend.app:app --host 0.0.0.0 --port 8000 --proxy-headers --workers 1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
